[package]
name = "facilerp"
version = "0.1.0"
description = "PROJ PARA FACILITAS"
authors = ["FacilERP"]
edition = "2021"

[lib]
name = "facilerp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.0.6", features = [] }
tauri-plugin-opener = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
